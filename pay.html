<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Оплата по QR</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            background: #f0f2f5;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            max-width: 550px;
            width: 100%;
            background: white;
            border-radius: 32px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }
        h2 {
            margin: 0 0 8px;
            font-size: 24px;
            text-align: center;
        }
        .sub {
            color: #555;
            margin-bottom: 20px;
            font-size: 14px;
            border-left: 3px solid #4caf50;
            padding-left: 12px;
        }
        label {
            font-weight: 600;
            display: block;
            margin-top: 16px;
            font-size: 14px;
        }
        select, input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 28px;
            font-size: 16px;
            background: #f9fafc;
        }
        button {
            margin-top: 20px;
            width: 100%;
            background: #2e7d32;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        button.secondary { background: #1565c0; }
        button.copy-btn { background: #ff8c00; margin-top: 12px; }
        .qr-block {
            text-align: center;
            margin: 20px 0;
        }
        #qrcode, #adminQrcode {
            display: inline-block;
            background: white;
            padding: 12px;
            border-radius: 24px;
        }
        .rub-amount {
            font-size: 42px;
            font-weight: bold;
            color: #2e7d32;
            margin: 20px 0;
            text-align: center;
        }
        .order-id {
            font-size: 14px;
            color: #555;
            background: #f5f5f5;
            padding: 6px 14px;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 10px;
        }
        .instruction {
            background: #eef2ff;
            border-radius: 20px;
            padding: 16px;
            margin: 20px 0 0;
            text-align: left;
            font-size: 14px;
        }
        .instruction ol { margin: 8px 0 8px 20px; padding: 0; }
        .instruction li { margin: 8px 0; }
        .rub-block {
            background: #f1f8e9;
            border-radius: 24px;
            padding: 16px;
            margin: 16px 0;
        }
        .flex-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .flex-row > div { flex: 1; }
        .small-note {
            font-size: 12px;
            color: #2e7d32;
            margin-top: 8px;
        }
        .footer {
            font-size: 11px;
            color: #888;
            text-align: center;
            margin-top: 24px;
            border-top: 1px solid #eee;
            padding-top: 16px;
        }
        .admin-badge {
            background: #ff9800;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 12px;
        }
        .client-form {
            margin-top: 16px;
        }
        .client-form button {
            background: #1565c0;
        }
        .loading {
            text-align: center;
            color: #555;
            padding: 30px 0;
        }
    </style>
</head>
<body>
<div id="app"></div>

<script>
    // ---------- КОНСТАНТЫ (фиксированный курс для всех банков) ----------
    const DEFAULT_BANK_ID = "970415";          // VietinBank
    const DEFAULT_ACCOUNT = "1045987857";
    const FIXED_RATE = 294.118;                // единый курс для Сбера, ВТБ, МТС

    // ---------- ГЕНЕРАЦИЯ УНИКАЛЬНОГО НОМЕРА ЗАКАЗА ----------
    function generateOrderId() {
        const now = new Date();
        const datePart = now.getFullYear() +
                        String(now.getMonth() + 1).padStart(2, '0') +
                        String(now.getDate()).padStart(2, '0');
        const randomPart = Math.random().toString(36).substring(2, 6).toUpperCase();
        return `ORD-${datePart}-${randomPart}`;
    }

    // ---------- ОБЩИЕ ФУНКЦИИ ----------
    function crc16_ccitt(data) {
        let crc = 0xFFFF;
        const polynomial = 0x1021;
        for (let i = 0; i < data.length; i++) {
            crc ^= (data.charCodeAt(i) << 8);
            for (let j = 0; j < 8; j++) {
                if (crc & 0x8000) crc = (crc << 1) ^ polynomial;
                else crc = (crc << 1);
                crc &= 0xFFFF;
            }
        }
        return crc;
    }

    function generateVietQR(bankId, account, amountVND) {
        const bankInfo = `0006${bankId}01${String(account).length.toString().padStart(2, '0')}${account}`;
        const tag38Data = `0010A00000072701${String(bankInfo.length).toString().padStart(2, '0')}${bankInfo}0208QRIBFTTA`;
        let payload = "000201";
        payload += "010212";
        payload += `38${String(tag38Data.length).toString().padStart(2, '0')}${tag38Data}`;
        payload += "5303704";
        const amtStr = Math.floor(amountVND).toString();
        payload += `54${String(amtStr.length).toString().padStart(2, '0')}${amtStr}`;
        payload += "5802VN";
        const tag62Inner = "011499MP8101a39c4803010070100824CHUYENTIEN99MP8101A39C48";
        payload += `62${String(tag62Inner.length).toString().padStart(2, '0')}${tag62Inner}`;
        payload += "6304";
        const crc = crc16_ccitt(payload);
        return payload + crc.toString(16).toUpperCase().padStart(4, '0');
    }

    // ---------- ОСНОВНАЯ ЛОГИКА ----------
    const urlParams = new URLSearchParams(window.location.search);
    const isAdmin = urlParams.has('admin');
    const hasPayParams = urlParams.has('rub') && urlParams.has('account') && urlParams.has('bankId') && urlParams.has('bank');

    const app = document.getElementById('app');

    // ---------- РЕЖИМ ОПЛАТЫ (ДЛЯ КЛИЕНТА) ----------
    if (hasPayParams && !isAdmin) {
        const rub = parseFloat(urlParams.get('rub'));
        const bankCode = urlParams.get('bank'); // 'sber', 'vtb', 'mts'
        const account = urlParams.get('account');
        const bankId = urlParams.get('bankId');
        const orderId = urlParams.get('order') || '—'; // если нет, не показываем

        // Используем переданные курсы, если есть, иначе FIXED_RATE
        const rateSber = parseFloat(urlParams.get('rateSber')) || FIXED_RATE;
        const rateVtb = parseFloat(urlParams.get('rateVtb')) || FIXED_RATE;
        const rateMts = parseFloat(urlParams.get('rateMts')) || FIXED_RATE;
        let rate;
        let bankName;
        switch (bankCode) {
            case 'sber': rate = rateSber; bankName = 'СберБанк'; break;
            case 'vtb': rate = rateVtb; bankName = 'ВТБ'; break;
            case 'mts': rate = rateMts; bankName = 'МТС Банк'; break;
            default: rate = rateSber; bankName = 'СберБанк';
        }
        const amountVND = Math.round(rub * rate);
        const qrString = generateVietQR(bankId, account, amountVND);
        const rubFormatted = new Intl.NumberFormat('ru-RU').format(rub) + ' ₽';

        app.innerHTML = `
            <div class="card">
                <h2>Оплата по QR</h2>
                ${orderId !== '—' ? `<div class="order-id">🧾 Заказ ${orderId}</div>` : ''}
                <div class="rub-amount">${rubFormatted}</div>
                <div class="qr-block">
                    <div id="qrcode"></div>
                </div>
                <div class="instruction">
                    <strong>📱 Как оплатить через ${bankName}:</strong>
                    <ol>
                        <li>Откройте приложение <strong>${bankName}</strong></li>
                        <li>Нажмите на иконку <strong>сканера QR-кода</strong> (в левом верхнем углу)</li>
                        <li>Наведите камеру на QR-код</li>
                        <li>Проверьте сумму и подтвердите оплату</li>
                    </ol>
                </div>
            </div>
        `;
        new QRCode(document.getElementById('qrcode'), { text: qrString, width: 280, height: 280, correctLevel: QRCode.CorrectLevel.M });
    }
    // ---------- АДМИН-РЕЖИМ (ПО ?admin=1) ----------
    else if (isAdmin) {
        // Список вьетнамских банков
        const bankList = [
            { name: "VietinBank", id: "970415" },
            { name: "Vietcombank", id: "970436" },
            { name: "BIDV", id: "970418" },
            { name: "Agribank", id: "970405" },
            { name: "Sacombank", id: "970403" },
            { name: "Techcombank", id: "970407" },
            { name: "VPBank", id: "970432" },
            { name: "TPBank", id: "970423" },
            { name: "MBbank", id: "970422" },
            { name: "ACB", id: "970416" }
        ];

        // Значения по умолчанию (фиксированный курс)
        let defaultBankId = DEFAULT_BANK_ID;
        let defaultAccount = DEFAULT_ACCOUNT;
        let defaultRate = FIXED_RATE;
        let defaultRub = 10000;

        function renderAdmin() {
            const bankOptions = bankList.map(b => `<option value="${b.id}" ${b.id === defaultBankId ? 'selected' : ''}>${b.name} (${b.id})</option>`).join('');
            app.innerHTML = `
                <div class="card">
                    <div class="admin-badge">🔧 Админ-панель (скрыта от клиентов)</div>
                    <h2>Генератор ссылок для оплаты</h2>
                    <div class="sub">Настрой параметры – QR меняется автоматически</div>

                    <label>🏦 Вьетнамский банк (получатель)</label>
                    <select id="bankSelect">
                        ${bankOptions}
                        <option value="custom">🔧 Свой ID</option>
                    </select>
                    <div id="customBankDiv" style="display: none; margin-top: 8px;">
                        <input type="text" id="customBankId" placeholder="Введите Bank ID">
                    </div>

                    <label>💳 Номер счёта (account) получателя</label>
                    <input type="text" id="account" value="${defaultAccount}">

                    <div class="rub-block">
                        <div class="small-note">🔄 Курсы конвертации (1 рубль = донгов) — фиксированные</div>
                        <div class="flex-row">
                            <div><label>Курс для Сбера</label><input type="number" id="rateSber" value="${defaultRate}" step="0.001"></div>
                            <div><label>Курс для ВТБ</label><input type="number" id="rateVtb" value="${defaultRate}" step="0.001"></div>
                            <div><label>Курс для МТС</label><input type="number" id="rateMts" value="${defaultRate}" step="0.001"></div>
                        </div>
                    </div>

                    <label>💰 Сумма в рублях (для плательщика)</label>
                    <input type="number" id="rubAmount" value="${defaultRub}" step="100">

                    <div class="flex-row">
                        <div><label>Банк плательщика</label>
                            <select id="bankSelectPayer">
                                <option value="sber">Сбер</option>
                                <option value="vtb">ВТБ</option>
                                <option value="mts">МТС</option>
                            </select>
                        </div>
                    </div>

                    <div class="qr-block">
                        <div id="adminQrcode"></div>
                        <div class="small-note">Этот QR-код увидит клиент (сумма в рублях будет пересчитана в донги по выбранному курсу)</div>
                    </div>

                    <button id="copyLinkBtn" class="copy-btn">🔗 Скопировать ссылку для клиента</button>
                    <div class="footer">Ссылка будет вести на эту же страницу без ?admin. Клиент увидит сумму в рублях и QR.</div>
                </div>
            `;

            const bankSelectElem = document.getElementById('bankSelect');
            const customBankDivElem = document.getElementById('customBankDiv');
            const customBankIdElem = document.getElementById('customBankId');
            const accountElem = document.getElementById('account');
            const rateSberElem = document.getElementById('rateSber');
            const rateVtbElem = document.getElementById('rateVtb');
            const rateMtsElem = document.getElementById('rateMts');
            const rubAmountElem = document.getElementById('rubAmount');
            const bankSelectPayer = document.getElementById('bankSelectPayer');
            const copyLinkBtn = document.getElementById('copyLinkBtn');
            const adminQrcodeDiv = document.getElementById('adminQrcode');

            function getBankId() {
                if (bankSelectElem.value === 'custom') return customBankIdElem.value.trim();
                return bankSelectElem.value;
            }

            function updateAdminQR() {
                const bankId = getBankId();
                const account = accountElem.value.trim();
                let rub = parseFloat(rubAmountElem.value);
                if (isNaN(rub)) rub = 0;
                const bankCode = bankSelectPayer.value;
                const rateSber = parseFloat(rateSberElem.value);
                const rateVtb = parseFloat(rateVtbElem.value);
                const rateMts = parseFloat(rateMtsElem.value);
                if (!bankId || !account || rub <= 0 || isNaN(rateSber) || isNaN(rateVtb) || isNaN(rateMts)) {
                    adminQrcodeDiv.innerHTML = '<div style="color:red;">Заполните все поля (сумма > 0, корректные курсы)</div>';
                    return;
                }
                if (!/^\d+$/.test(bankId)) {
                    adminQrcodeDiv.innerHTML = '<div style="color:red;">Bank ID должен состоять из цифр</div>';
                    return;
                }
                let rate;
                switch (bankCode) {
                    case 'sber': rate = rateSber; break;
                    case 'vtb': rate = rateVtb; break;
                    case 'mts': rate = rateMts; break;
                    default: rate = rateSber;
                }
                const amountVND = Math.round(rub * rate);
                const qrString = generateVietQR(bankId, account, amountVND);
                adminQrcodeDiv.innerHTML = '';
                new QRCode(adminQrcodeDiv, {
                    text: qrString,
                    width: 260,
                    height: 260,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.M
                });
            }

            function copyClientLink() {
                const bankId = getBankId();
                const account = accountElem.value.trim();
                const rub = parseFloat(rubAmountElem.value);
                const bankCode = bankSelectPayer.value;
                const rateSber = parseFloat(rateSberElem.value);
                const rateVtb = parseFloat(rateVtbElem.value);
                const rateMts = parseFloat(rateMtsElem.value);
                if (!bankId || !account || isNaN(rub) || rub <= 0 || isNaN(rateSber) || isNaN(rateVtb) || isNaN(rateMts)) {
                    alert("Заполните все поля корректно");
                    return;
                }
                // Генерируем уникальный номер заказа
                const orderId = generateOrderId();
                let url = window.location.origin + window.location.pathname;
                let params = new URLSearchParams();
                params.set('rub', rub);
                params.set('account', account);
                params.set('bankId', bankId);
                params.set('bank', bankCode);
                params.set('rateSber', rateSber);
                params.set('rateVtb', rateVtb);
                params.set('rateMts', rateMts);
                params.set('order', orderId);
                const fullUrl = url + '?' + params.toString();
                navigator.clipboard.writeText(fullUrl).then(() => {
                    alert("✅ Ссылка скопирована!\nЗаказ №" + orderId + "\nКлиент увидит сумму в рублях и QR.");
                }).catch(() => alert("Не удалось скопировать. Скопируйте вручную:\n" + fullUrl));
            }

            bankSelectElem.addEventListener('change', () => {
                customBankDivElem.style.display = bankSelectElem.value === 'custom' ? 'block' : 'none';
                updateAdminQR();
            });
            if (customBankIdElem) customBankIdElem.addEventListener('input', updateAdminQR);
            accountElem.addEventListener('input', updateAdminQR);
            rateSberElem.addEventListener('input', updateAdminQR);
            rateVtbElem.addEventListener('input', updateAdminQR);
            rateMtsElem.addEventListener('input', updateAdminQR);
            rubAmountElem.addEventListener('input', updateAdminQR);
            bankSelectPayer.addEventListener('change', updateAdminQR);
            copyLinkBtn.addEventListener('click', copyClientLink);

            if (bankSelectElem.value === 'custom') customBankDivElem.style.display = 'block';
            updateAdminQR();
        }
        renderAdmin();
    }
    // ---------- КЛИЕНТСКАЯ ФОРМА (переходник) ----------
    else {
        app.innerHTML = `
            <div class="card">
                <h2>Оплата по QR</h2>
                <div class="sub">Выберите ваш банк и введите сумму в рублях</div>
                <form id="clientForm" class="client-form">
                    <label>🏦 Ваш банк (для оплаты)</label>
                    <select id="clientBank" required>
                        <option value="sber">СберБанк</option>
                        <option value="vtb">ВТБ</option>
                        <option value="mts">МТС Банк</option>
                    </select>

                    <label>💰 Сумма (рубли)</label>
                    <input type="number" id="clientRub" placeholder="Например, 10000" step="100" min="100" required>

                    <button type="submit">Оплатить</button>
                </form>
                <div class="footer">После нажатия вы перейдёте на страницу с QR-кодом</div>
            </div>
        `;

        document.getElementById('clientForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const bank = document.getElementById('clientBank').value;
            const rub = parseFloat(document.getElementById('clientRub').value);
            if (!rub || rub <= 0) {
                alert('Введите корректную сумму (больше 0)');
                return;
            }
            const orderId = generateOrderId();
            const params = new URLSearchParams();
            params.set('rub', rub);
            params.set('account', DEFAULT_ACCOUNT);
            params.set('bankId', DEFAULT_BANK_ID);
            params.set('bank', bank);
            params.set('rateSber', FIXED_RATE);
            params.set('rateVtb', FIXED_RATE);
            params.set('rateMts', FIXED_RATE);
            params.set('order', orderId);
            const url = window.location.origin + window.location.pathname + '?' + params.toString();
            window.location.href = url;
        });
    }
</script>
</body>
</html>
